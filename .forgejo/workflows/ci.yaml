name: Elixir CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    container:
      image: docker.gitea.com/runner-images:ubuntu-24.04
    steps:
    - name: Verify OS
      run: |
        cat /etc/os-release
        uname -a
    - name: Check out git repository
      uses: actions/checkout@v4
    - name: Set up Elixir
      uses: https://github.com/erlef/setup-beam@v1
      with:
        elixir-version: '1.19'
        otp-version: '28'
    - name: Install dependencies
      run: mix deps.get
    - name: Check formatting
      run: mix format --check-formatted
    - name: Compile with warnings as errors
      run: mix compile --warnings-as-errors
    - name: Build escript
      run: mix escript.build
    - name: Run tests
      run: mix test

  release:
    name: Build standalone binaries
    runs-on: ubuntu-24.04
    container:
      image: docker.gitea.com/runner-images:ubuntu-24.04
    steps:
    - name: Check out git repository
      uses: actions/checkout@v4
    - name: Set up Elixir
      uses: https://github.com/erlef/setup-beam@v1
      with:
        elixir-version: '1.19'
        otp-version: '28'
    - name: Install xz, 7z and curl
      run: |
        apt-get update
        apt-get install -y curl xz-utils p7zip-full
    - name: Install Zig
      run: |
        curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o /tmp/zig.tar.xz
        mkdir -p /opt/zig
        tar -xf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
        echo /opt/zig >> "$GITHUB_PATH"
    - name: Install dependencies
      run: mix deps.get
    - name: Build binaries
      run: MIX_ENV=prod mix release --overwrite
    - name: Smoke test the Linux binary
      run: |
        chmod +x burrito_out/wc_linux_x86_64
        ./test/smoke.sh ./burrito_out/wc_linux_x86_64
    - name: Upload binaries
      uses: https://github.com/actions/upload-artifact@v3
      with:
        name: burrito-binaries
        path: burrito_out/*
