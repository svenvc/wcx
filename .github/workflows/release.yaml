name: Release

on:
  push:
    tags: [ "v*" ]

jobs:
  release:
    name: Build standalone binaries and publish a release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - name: Check out git repository
      uses: actions/checkout@v7
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.19'
        otp-version: '28'
    - name: Install xz, 7z and curl
      run: |
        sudo apt-get update
        sudo apt-get install -y curl xz-utils p7zip-full
    - name: Install Zig
      run: |
        curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o /tmp/zig.tar.xz
        sudo mkdir -p /opt/zig
        sudo tar -xf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
        echo /opt/zig >> "$GITHUB_PATH"
    - name: Restore ERTS cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/burrito_file_cache
        key: burrito-erts-${{ hashFiles('lib/wc/release/erts_resolver.ex') }}
    - name: Install dependencies
      run: mix deps.get
    - name: Build binaries
      run: MIX_ENV=prod mix release --overwrite
    - name: Smoke test the Linux binary
      run: |
        chmod +x burrito_out/wc_linux_x86_64
        ./test/smoke.sh ./burrito_out/wc_linux_x86_64
    - name: Write checksums
      run: cd burrito_out && sha256sum wc_* > checksums.txt
    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        files: burrito_out/*
        generate_release_notes: true